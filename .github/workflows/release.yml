name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps (for analyze)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libsecret-1-dev
      - name: Apply patches & verify
        run: |
          flutter pub get
          bash tool/apply_patches.sh
          flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libsecret-1-dev
      - name: Apply patches
        run: |
          flutter pub get
          bash tool/apply_patches.sh
          flutter pub get
      - name: Build Linux release
        run: flutter build linux --release
      - uses: actions/upload-artifact@v5
        with:
          name: gridzero-linux-x64
          path: build/linux/x64/release/bundle/
          compression-level: 9

  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patches
        shell: bash
        run: |
          flutter pub get
          bash tool/apply_patches.sh
          flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v5
        with:
          name: gridzero-windows-x64
          path: build/windows/x64/runner/Release/

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Apply patches
        run: |
          flutter pub get
          bash tool/apply_patches.sh
          flutter pub get
      - name: Build APK release (unsigned, CI)
        run: flutter build apk --release --verbose
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false"
      - name: Build AppBundle release (unsigned, CI)
        run: flutter build appbundle --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false"
      - uses: actions/upload-artifact@v5
        with:
          name: gridzero-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: gridzero-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Zip Linux bundle
        run: |
          cd artifacts/gridzero-linux-x64
          zip -r ../../gridzero-linux-x64.zip .
          cd ../..
      - name: Zip Windows bundle
        run: |
          cd artifacts/gridzero-windows-x64
          zip -r ../../gridzero-windows-x64.zip .
          cd ../..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gridzero-linux-x64.zip
            gridzero-windows-x64.zip
            artifacts/gridzero-android-apk/app-release.apk
            artifacts/gridzero-android-aab/app-release.aab
          generate_release_notes: true

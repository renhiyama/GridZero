name: windows-build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply pub-cache patches
        run: |
          flutter pub get
          bash tool/apply_patches.sh || true
          flutter pub get
        shell: bash
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: gridzero-windows
          path: build/windows/x64/runner/Release/
